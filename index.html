<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R216 — Stats Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── TOKENS (mobile defaults) ── */
:root{
–bg:#0c0d0e;
–surface:#141516;
–surface2:#1c1d1e;
–border:rgba(255,255,255,0.07);
–border2:rgba(255,255,255,0.14);
–text:#ede9e3;
–muted:#7a7672;
–accent:#7eb8a0;
–accent2:#a8d4c0;
–excel:#1f7244;
–matlab:#8040c0;
–stats:#b06040;
–proba:#4080b0;
–flip:0.5s;
–px:1rem;
}

html{scroll-behavior:smooth}
body{
background:var(–bg);color:var(–text);
font-family:‘Syne’,sans-serif;
min-height:100vh;max-width:100vw;overflow-x:hidden;
}

/* ── HEADER ── */
header{
padding:.9rem var(–px);
border-bottom:.5px solid var(–border);
display:flex;align-items:center;justify-content:space-between;
gap:.5rem;flex-wrap:wrap;
}
.logo{display:flex;align-items:baseline;gap:.6rem;flex-shrink:0}
.logo h1{font-family:‘Instrument Serif’,serif;font-size:1.4rem;letter-spacing:-.02em}
.logo .tag{
font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;
color:var(–muted);font-weight:600;
border:.5px solid var(–border2);padding:.15rem .4rem;border-radius:3px;
}
.progress-info{font-size:.7rem;color:var(–muted)}
.progress-info span{color:var(–accent);font-weight:700}

/* ── TABS ── */
.tabs-wrap{position:relative;border-bottom:.5px solid var(–border)}
.tabs-scroll{
display:flex;gap:.25rem;padding:.6rem var(–px);
overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab{
background:none;border:.5px solid var(–border);
color:var(–muted);font-family:‘Syne’,sans-serif;
font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
padding:.3rem .65rem;border-radius:4px;cursor:pointer;
white-space:nowrap;flex-shrink:0;transition:all .2s;
}
.tab:hover{border-color:var(–border2);color:var(–text)}
.tab.active{background:var(–surface2);border-color:var(–accent);color:var(–accent)}
.tab.cat-excel.active{border-color:var(–excel);color:#3db87a}
.tab.cat-matlab.active{border-color:var(–matlab);color:#b070e0}
.tab.cat-stats.active{border-color:var(–stats);color:#d08060}
.tab.cat-proba.active{border-color:var(–proba);color:#60a0d0}
.tab-arrow{
position:absolute;top:0;bottom:0;width:32px;
display:flex;align-items:center;justify-content:center;
cursor:pointer;z-index:2;background:none;border:none;
color:var(–muted);font-size:.9rem;
opacity:0;pointer-events:none;transition:opacity .2s;
}
.tab-arrow.visible{opacity:1;pointer-events:all}
.tab-arrow.left{left:0;background:linear-gradient(to right,var(–bg) 55%,transparent)}
.tab-arrow.right{right:0;background:linear-gradient(to left,var(–bg) 55%,transparent)}

/* ── MAIN ── */
main{
display:flex;flex-direction:column;align-items:center;
padding:1.2rem var(–px) 2.5rem;gap:1rem;
}

/* ── PROGRESS BAR ── */
.progress-bar{width:100%;max-width:700px;height:2px;background:var(–surface2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(–accent);border-radius:2px;transition:width .4s ease}

/* ── STATS BAR ── */
.stats-bar{display:flex;gap:.9rem;font-size:.65rem;color:var(–muted);flex-wrap:wrap;justify-content:center}
.stats-bar .s{display:flex;align-items:center;gap:.25rem}
.stats-bar .s b{font-weight:700}
.stats-bar .s.ok b{color:#5a9e6f}
.stats-bar .s.ko b{color:#b04040}
.stats-bar .s.to b{color:var(–accent)}

/* ── CARD
FIX: use CSS grid so front+back stack in same cell.
The container auto-sizes to the tallest face.
No absolute positioning = no height collapse.
── */
.card-area{width:100%;max-width:700px;cursor:pointer}
.card-area:active{opacity:.95}

.card-inner{
width:100%;
transform-style:preserve-3d;
transition:transform var(–flip) cubic-bezier(.4,0,.2,1);
border-radius:12px;
}
.card-inner.flipped{transform:rotateY(180deg)}

/* Grid trick: both faces in same cell, same size */
.card-faces-grid{
display:grid;
grid-template-areas:“card”;
width:100%;
}
.card-face{
grid-area:card;
backface-visibility:hidden;
-webkit-backface-visibility:hidden;
border-radius:12px;
border:.5px solid var(–border2);
/* mobile padding */
padding:1rem .9rem .9rem;
display:flex;flex-direction:column;gap:.65rem;
/* text must never overflow */
word-break:break-word;overflow-wrap:break-word;
/* min-height so short cards don’t look tiny */
min-height:190px;
}
.card-front{background:var(–surface)}
.card-back{background:var(–surface2);transform:rotateY(180deg)}

/* category border tints */
.cat-essentiel.card-face{border-color:rgba(126,184,160,.22)}
.cat-excel.card-face{border-color:rgba(31,114,68,.3)}
.cat-matlab.card-face{border-color:rgba(128,64,192,.3)}
.cat-stats.card-face{border-color:rgba(176,96,64,.3)}
.cat-proba.card-face{border-color:rgba(64,128,176,.3)}

.card-header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.card-cat{
font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;
font-weight:700;padding:.17rem .42rem;border-radius:3px;border:.5px solid;
}
.cat-excel .card-cat{color:#3db87a;border-color:var(–excel)}
.cat-matlab .card-cat{color:#b070e0;border-color:var(–matlab)}
.cat-stats .card-cat{color:#d08060;border-color:var(–stats)}
.cat-proba .card-cat{color:#60a0d0;border-color:var(–proba)}
.cat-essentiel .card-cat{color:var(–accent);border-color:var(–accent)}
.card-num{font-size:.58rem;color:var(–muted);font-family:‘JetBrains Mono’,monospace}

/* Question */
.card-q{
font-family:‘Instrument Serif’,serif;
font-size:1.05rem;line-height:1.55;
color:var(–text);flex:1;
}
/* Answer */
.card-a{
font-size:.8rem;line-height:1.75;
color:var(–text);flex:1;
}
.card-a code{
font-family:‘JetBrains Mono’,monospace;font-size:.7rem;
background:rgba(255,255,255,.07);
padding:.1rem .32rem;border-radius:3px;color:var(–accent2);
/* inline code wraps on mobile */
word-break:break-all;
}
.card-a pre{
font-family:‘JetBrains Mono’,monospace;font-size:.68rem;
background:rgba(255,255,255,.04);
border:.5px solid var(–border2);
padding:.55rem .65rem;border-radius:6px;
color:var(–accent2);line-height:1.6;
/* pre wraps — never overflows */
white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;
width:100%;margin-top:.2rem;
}

.card-hint{
font-size:.53rem;letter-spacing:.08em;text-transform:uppercase;
color:var(–muted);text-align:center;flex-shrink:0;padding-top:.15rem;
}

/* ── VERDICT ── */
.verdict{
display:flex;gap:.6rem;justify-content:center;
width:100%;max-width:700px;
}
.verdict-btn{
flex:1;
padding:.65rem .5rem;border-radius:8px;
font-family:‘Syne’,sans-serif;font-size:.68rem;
font-weight:700;letter-spacing:.05em;text-transform:uppercase;
cursor:pointer;transition:all .2s;border:.5px solid;
}
.verdict-btn.known{background:rgba(90,158,111,.1);border-color:rgba(90,158,111,.4);color:#5a9e6f}
.verdict-btn.known:hover{background:rgba(90,158,111,.2)}
.verdict-btn.unknown{background:rgba(180,60,60,.08);border-color:rgba(180,60,60,.35);color:#b04040}
.verdict-btn.unknown:hover{background:rgba(180,60,60,.15)}

/* ── CONTROLS ── */
.controls{
display:flex;gap:.45rem;align-items:center;
flex-wrap:wrap;justify-content:center;
width:100%;max-width:700px;
}
.btn{
background:var(–surface);border:.5px solid var(–border2);
color:var(–muted);font-family:‘Syne’,sans-serif;
font-size:.6rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
padding:.48rem .8rem;border-radius:6px;cursor:pointer;
transition:all .18s;white-space:nowrap;flex-shrink:0;
}
.btn:hover{color:var(–text);border-color:rgba(255,255,255,.25)}
.btn.primary{background:rgba(126,184,160,.1);border-color:var(–accent);color:var(–accent)}
.btn.primary:hover{background:rgba(126,184,160,.18)}
.btn.danger{border-color:rgba(200,80,70,.4);color:#c05048}
.btn.danger:hover{background:rgba(200,80,70,.1)}

/* ── EMPTY ── */
.empty{text-align:center;padding:2.5rem;color:var(–muted);font-size:.85rem}
.empty .emoji{font-size:2rem;margin-bottom:.75rem}

/* ── TOAST ── */
.toast{
position:fixed;bottom:1.5rem;left:50%;
transform:translateX(-50%) translateY(4rem);
background:var(–surface2);border:.5px solid var(–border2);
padding:.5rem 1rem;border-radius:8px;
font-size:.72rem;color:var(–text);
opacity:0;transition:all .3s;z-index:999;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ════════════════════════════════════════════
MEDIA QUERIES — mobile-first breakpoints
xs  : 0–479px    phone portrait  (base above)
sm  : 480–767px  phone landscape / small tablet
md  : 768–1023px tablet portrait
lg  : 1024px+    desktop
════════════════════════════════════════════ */

@media(min-width:480px){
:root{–px:1.4rem}
.logo h1{font-size:1.55rem}
.card-face{padding:1.4rem 1.2rem 1.1rem;gap:.8rem;min-height:210px}
.card-q{font-size:1.15rem}
.card-a{font-size:.83rem}
.card-a pre{font-size:.71rem;padding:.6rem .7rem}
.btn{font-size:.62rem;padding:.5rem .85rem}
.verdict-btn{font-size:.7rem;padding:.68rem .75rem}
.tab{font-size:.64rem}
}

@media(min-width:768px){
:root{–px:2rem}
header{padding:1.3rem var(–px) 1rem}
.logo h1{font-size:1.75rem}
.logo .tag{font-size:.6rem}
.tabs-scroll{padding:.7rem var(–px)}
main{padding:1.8rem var(–px) 2.5rem;gap:1.3rem}
.card-face{padding:1.8rem 1.6rem 1.4rem;gap:.95rem;min-height:230px}
.card-q{font-size:1.25rem}
.card-a{font-size:.86rem}
.card-a pre{font-size:.73rem;padding:.7rem .85rem}
.card-a code{font-size:.74rem}
.verdict-btn{font-size:.72rem;padding:.72rem 1rem;max-width:240px}
.btn{font-size:.65rem;padding:.52rem .95rem}
.tab{font-size:.66rem;padding:.32rem .72rem}
.stats-bar{font-size:.67rem;gap:1.2rem}
.progress-bar{height:3px}
}

@media(min-width:1024px){
:root{–px:2.5rem}
header{padding:1.6rem var(–px) 1.2rem}
.logo h1{font-size:1.9rem}
.tabs-scroll{padding:.75rem var(–px)}
main{padding:2rem var(–px) 3rem;gap:1.5rem}
.card-area{transition:transform .15s}
.card-area:hover{transform:translateY(-2px)}
.card-area:active{transform:scale(.99)}
.card-face{padding:2.2rem 2.2rem 1.8rem;gap:1.1rem;min-height:250px}
.card-q{font-size:1.33rem}
.card-a{font-size:.88rem}
.card-a pre{font-size:.75rem;padding:.78rem 1rem}
.card-a code{font-size:.77rem}
.verdict-btn{font-size:.73rem;padding:.75rem 1.2rem;max-width:260px}
.btn{font-size:.68rem;padding:.55rem 1.1rem}
.tab{font-size:.69rem;padding:.34rem .78rem}
.stats-bar{font-size:.7rem;gap:1.5rem}
}
</style>

</head>
<body>

<header>
  <div class="logo">
    <h1>R216 Stats</h1>
    <span class="tag">Flashcards TP</span>
  </div>
  <div class="progress-info">
    <span id="knownCount">0</span> / <span id="totalCount">0</span> connues
  </div>
</header>

<div class="tabs-wrap">
  <button class="tab-arrow left" id="arrowLeft" onclick="scrollTabs(-1)">‹</button>
  <div class="tabs-scroll" id="tabsContainer"></div>
  <button class="tab-arrow right" id="arrowRight" onclick="scrollTabs(1)">›</button>
</div>

<main>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="stats-bar">
    <span class="s ok">✓ Connues : <b id="s-known">0</b></span>
    <span class="s ko">✗ À revoir : <b id="s-unknown">0</b></span>
    <span class="s to">◎ Restantes : <b id="s-left">0</b></span>
  </div>

  <div class="card-area" id="cardArea" onclick="flipCard()">
    <div class="card-inner" id="cardInner">
      <div class="card-faces-grid">
        <div class="card-face card-front" id="cardFront">
          <div class="card-header">
            <span class="card-cat" id="frontCat"></span>
            <span class="card-num" id="cardNum"></span>
          </div>
          <div class="card-q" id="cardQ"></div>
          <div class="card-hint">↑ toucher pour voir la réponse</div>
        </div>
        <div class="card-face card-back" id="cardBack">
          <div class="card-header">
            <span class="card-cat" id="backCat"></span>
            <span class="card-num" id="backNum"></span>
          </div>
          <div class="card-a" id="cardA"></div>
          <div class="card-hint">↑ toucher pour remettre la question</div>
        </div>
      </div>
    </div>
  </div>

  <div class="verdict" id="verdictZone" style="display:none">
    <button class="verdict-btn unknown" onclick="markCard(false)">✗ À revoir</button>
    <button class="verdict-btn known" onclick="markCard(true)">✓ Je sais</button>
  </div>

  <div class="controls">
    <button class="btn" onclick="prevCard()">← Préc</button>
    <button class="btn" onclick="nextCard()">Suiv →</button>
    <button class="btn primary" onclick="shuffleDeck()">⇄ Mélanger</button>
    <button class="btn" onclick="resetCategory()">↺ Reset cat.</button>
    <button class="btn danger" onclick="resetAll()">✕ Tout reset</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────
const ALL_CARDS = [

{id:'e01',cat:'Essentiel',q:"Quelle fonction Excel calcule la fréquence d'une valeur dans une plage ?",a:"<code>NB.SI(plage; critère)</code> — Ex : <code>=NB.SI(C$3:C$26; C3)</code> pour compter combien de fois la taille en C3 apparaît dans la colonne C."},
{id:'e02',cat:'Essentiel',q:"Comment figer une plage dans une formule Excel pour pouvoir la dupliquer ?",a:"Avec le symbole <code>$</code>. Ex : <code>C$3:C$26</code> fige les lignes 3 et 26 → la formule peut être copiée vers le bas sans que la plage bouge."},
{id:'e03',cat:'Essentiel',q:"Quelle fonction Excel donne la corrélation entre deux séries ?",a:"<code>COEFFICIENT.CORRELATION(plage1; plage2)</code> — renvoie un nombre entre -1 et +1. Valeur diagonale = 1 (corrélation avec soi-même)."},
{id:'e04',cat:'Essentiel',q:"Quelles 3 fonctions Excel calculent les stats par matière/étudiant ? Pourquoi figer avec $ ?",a:"<code>MOYENNE(plage)</code>, <code>MEDIANE(plage)</code>, <code>ECARTYPE.PEARSON(plage)</code><br><br>Figer avec $ : données en B2:G7. Pour la moyenne par matière en I2 : <code>=MOYENNE($B2:$G2)</code> — on fige les colonnes B et G. Sans $, en copiant vers I3, Excel décalerait vers C2:H2 au lieu de B3:G3."},
{id:'e05',cat:'Essentiel',q:"Comment obtenir les quartiles dans Excel ? Différence QUARTILE vs PREVISION ?",a:"<code>QUARTILE(plage; k)</code> avec k=0(min), 1, 2, 3, 4(max).<br><code>PREVISION(x; y_connus; x_connus)</code> = interpolation linéaire → mettre col Fi(%) en x_connus et col xi en y_connus pour les déciles."},
{id:'e06',cat:'Essentiel',q:"Dans Matlab, quelle commande génère le tableau statistique ? Comment supprimer les lignes vides ?",a:"<code>tab_stat = tabulate(tailles)</code> → génère xi, ni, fi(%).<br>Supprimer les zéros :<pre>tab_stat(all(tab_stat(:,2)==0,2),:) = [];</pre>"},

{id:‘e07’,cat:‘Essentiel’,q:“Comment obtenir les cumulés Ni et Fi(%) dans Matlab ?”,a:”<pre>tab_cum = cumsum(tab_stat(:,2));</pre>Puis Fi(%) = Ni/n×100. Assembler : <code>[tab_stat, tab_cum]</code>.<br>Notation <code>tab_stat(:,2)</code> = toutes les lignes de la colonne 2.”},
{id:‘e08’,cat:‘Essentiel’,q:“Quelle commande Matlab calcule les 5 quantiles (min, Q1, médiane, Q3, max) ?”,a:”<pre>quantile(tailles, [0 0.25 0.5 0.75 1])</pre>Renvoie un vecteur de 5 valeurs. Moyenne : <code>mean(tailles)</code>.”},
{id:‘e09’,cat:‘Essentiel’,q:“Différence corrélation inter-étudiants vs inter-matières dans Matlab ?”,a:“Inter-étudiants : <code>corrcoef(notes)</code> → 6×6 (colonnes = étudiants).<br>Inter-matières : <code>corrcoef(notes’)</code> → transposer d’abord, les matières deviennent colonnes.<br>Transposition Matlab = simple quote <code>’</code>”},
{id:‘e10’,cat:‘Essentiel’,q:“Comment afficher un tableau avec intitulés de colonnes dans Matlab ?”,a:”<pre>La_table = array2table(tab);\nnoms = ["col1" "col2"];\nLa_table.Properties.VariableNames = noms;\nLa_table</pre>Pour les lignes : <code>.Properties.RowNames</code>”},

{id:‘x01’,cat:‘Excel’,q:“Ordre des colonnes du tableau statistique sous Excel (TP1).”,a:“A: n° d’ordre | B: données brutes | C: triées croissant | D: effectifs ni = <code>NB.SI(C$3:C$26;C3)</code> | E: index 1 à r | F-G: xi et ni sans doublon (copier-coller + supprimer à la main) | H: Ni cumulé | I: fi(%) = ni/n×100 | J: Fi(%) cumulé”},
{id:‘x02’,cat:‘Excel’,q:“Pourquoi ne pas utiliser l’affichage % d’Excel pour fi et Fi ?”,a:“L’affichage % stocke 0.42 mais affiche 42%. Pour PREVISION et les interpolations on a besoin du nombre 42, pas 0.42. Donc multiplier manuellement par 100 dans la formule.”},
{id:‘x03’,cat:‘Excel’,q:“Comment dupliquer la formule de corrélation inter-étudiants pour toute la matrice ?”,a:“En B17 : <code>=COEFFICIENT.CORRELATION($B$2:$B$7; B$2:B$7)</code><br>Figer la 1ère colonne (Jo) avec $. En dupliquant à droite, la 2ème matrice glisse vers William, Jack… La 1ère reste fixe.”},
{id:‘x04’,cat:‘Excel’,q:“Mise en forme conditionnelle sur la matrice de corrélation ?”,a:“Stocker ±0.7 dans 2 cellules (ex I12 et J12). MFC → Supérieur à → vert (≥0.7), Inférieur à → rouge (≤-0.7). Visualise d’un coup les liaisons fortes.”},
{id:‘x05’,cat:‘Excel’,q:“Formule de la loi normale dans Excel (TP4) ?”,a:”<pre>=1/(B$3*RACINE(2)*PI())\n  *EXP(-(A5-B$2)^2\n       /(2*B$3^2))</pre>B$2=moyenne figée, B$3=écart-type figé, A5=valeur x. Mettre parenthèses après le signe moins dans EXP.”},
{id:‘x06’,cat:‘Excel’,q:“Générer 1000 tailles aléatoires en loi normale N(180,10) dans Excel ?”,a:”<code>=ARRONDI(LOI.NORMALE.STANDARD.INVERSE(ALEA())*10+180;0)</code><br>ALEA()→[0,1], inverse loi normale centrée, ×10=σ, +180=μ, ARRONDI(;0)=entier.”},
{id:‘x07’,cat:‘Excel’,q:“Corrélation inter-matières : étape supplémentaire par rapport à inter-étudiants ?”,a:“Transposer d’abord : Copier → Collage spécial → Transposer. Les matières passent en colonnes. Même technique ensuite : COEFFICIENT.CORRELATION avec 1ère colonne figée.”},
{id:‘x08’,cat:‘Excel’,q:“Différence ECARTYPE.PEARSON vs ECARTYPE.STANDARD ?”,a:“PEARSON divise par n (population entière). STANDARD divise par n-1 (estimateur). Dans les TP : toujours PEARSON car on a toutes les données.”},
{id:‘x09’,cat:‘Excel’,q:“Comment créer les 2 graphiques du TP1 (effectifs et % cumulés) ?”,a:“Sélectionner xi + ni → Insertion → Nuage de points (surtout pas histogramme ou courbe : ces types utilisent 1,2,3… en abscisse au lieu des vraies valeurs). Régler min/max de l’axe x.”},

{id:‘m01’,cat:‘Matlab’,q:“Lire un fichier Excel dans Matlab : points d’attention.”,a:“Utiliser la fonction fournie dans R216_stats1.m. L’onglet ne doit pas contenir de graphique. Noms corrects. Vérifier avec <code>tailles</code> dans la console. Transposer pour obtenir en ligne : <code>tailles’</code>”},
{id:‘m02’,cat:‘Matlab’,q:“Syntaxe d’affichage texte + variables dans Matlab ?”,a:”<pre>disp([‘texte ‘,num2str(val),’ suite’])</pre>Crochets = concaténation. Texte entre quotes simples. Nombres → <code>num2str()</code>. Ex :<pre>disp([‘moyenne : ‘,num2str(mean(tailles))])</pre>”},
{id:‘m03’,cat:‘Matlab’,q:“Tableau cumulatif complet 5 colonnes avec intitulés dans Matlab ?”,a:”<pre>tab_cum=[cumsum(tab_stat(:,2)),\n         cumsum(tab_stat(:,3))];\ntab_final=[tab_stat,tab_cum];\nT=array2table(tab_final);\nT.Properties.VariableNames=\n  ["xi" "ni" "fi" "Ni" "Fi"];\nT</pre>”},
{id:‘m04’,cat:‘Matlab’,q:“Différence entre ; et espace dans les crochets Matlab ?”,a:”<code>[a b]</code> = côte à côte (horizontal).<br><code>[a;b]</code> = l’un sous l’autre (vertical).<br>Ex : <code>s=[mean(n); median(n); std(n,1)]</code> = 3 lignes, une par stat.”},
{id:‘m05’,cat:‘Matlab’,q:“Commandes essentielles pour tracer les graphiques Matlab (TP1).”,a:”<pre>figure\nplot(xi,fi,‘b-’)   % courbe bleue\nhold on\nplot(xi,Fi,‘r-’)   % cumulé rouge\ngrid\ntitle(‘Titre’)\nbar(xi,ni,‘g’)     % histogramme vert</pre>”},
{id:‘m06’,cat:‘Matlab’,q:“Calculer moyenne/médiane/écart-type par étudiant ET par matière dans Matlab.”,a:“Par étudiant (colonnes) :<br><code>mean(notes)</code>, <code>median(notes)</code>, <code>std(notes,1)</code><br><br>Par matière (transposer) :<br><code>mean(notes’)</code>, <code>median(notes’)</code>, <code>std(notes’,1)</code>”},
{id:‘m07’,cat:‘Matlab’,q:“Indexation tableaux Matlab : syntaxe et exemples.”,a:“Format : <code>tab(lignes, colonnes)</code>. <code>:</code> seul = tout.<br>• <code>tab(:,2)</code> = toute la colonne 2<br>• <code>tab(1:10,1:2)</code> = lignes 1-10, colonnes 1-2<br>• <code>tab(3,:)</code> = toute la ligne 3”},
{id:‘m08’,cat:‘Matlab’,q:“Console vs éditeur dans Matlab. Rôle du point-virgule.”,a:“Console : immédiat, pour tester. Éditeur : fichier .m sauvegardé. Le <code>;</code> supprime l’affichage. Sans <code>;</code> → résultat affiché. Méthode : tester en console, écrire dans l’éditeur.”},
{id:‘m09’,cat:‘Matlab’,q:“Comment transposer une matrice dans Matlab ? Pourquoi c’est utile ?”,a:“Simple quote : <code>notes’</code>. Les fonctions opèrent sur les colonnes. Étudiants en colonnes → <code>mean(notes)</code> = moyenne par étudiant. Matières en colonnes → <code>mean(notes’)</code> = moyenne par matière.”},
{id:‘m10’,cat:‘Matlab’,q:“Créer des vecteurs de noms pour intituler les tables Matlab.”,a:”<pre>noms=["Jo" "William" "Jack"\n      "Averell" "Adeline" "Leona"];\nmats=["maths" "physique" "techno"\n      "anglais" "francais" "philo"];\ncara=["moyenne" "mediane" "ecart type"];</pre>”},

{id:‘s01’,cat:‘Stats’,q:“6 colonnes d’un tableau statistique et leur signification.”,a:“i : index | xi : valeurs distinctes triées | ni : effectifs | Ni : cumulés = Σni | fi(%) = ni×100/n | Fi(%) = Ni×100/n”},
{id:‘s02’,cat:‘Stats’,q:“Formule variance et écart-type. Unités ?”,a:“σ²X = (1/n)×Σ(di−x̄)² → unité² (ex: m²)<br>σX = √σ²X → même unité que les données<br>On trace σ sur un graphique, jamais σ² (unités incompatibles).”},
{id:‘s03’,cat:‘Stats’,q:“Quand préférer la médiane à la moyenne ?”,a:“Quand des valeurs extrêmes (outliers) faussent la moyenne. Ex : salaires — quelques très hauts salaires tirent la moyenne vers le haut, la médiane reste représentative.”},
{id:‘s04’,cat:‘Stats’,q:“Corrélation : formule et interprétation de -1, 0, +1.”,a:“r = (1/n)×Σ((xi−x̄)/σX)×((yi−ȳ)/σY)<br>+1 = droite montante | 0 = indépendants | -1 = droite descendante<br>⚠ Toujours regarder le graphique : des outliers peuvent fausser r.”},
{id:‘s05’,cat:‘Stats’,q:“Interpolation linéaire pour trouver un quantile manquant.”,a:“On a (x1,y1) et (x2,y2), on cherche y pour x donné :<br>a = (y2−y1)/(x2−x1), b = y1−a×x1, y = a×x+b<br>Ex: x1=72.91%, y1=50ans, x2=79.16%, y2=52ans → Q3(75%) = 50.7 ans.”},
{id:‘s06’,cat:‘Stats’,q:“Moyenne pondérée : formule et paradoxe.”,a:“x̄w = Σ(wi×xi)/Σwi<br>Ex: dev 12 coef3, prog 14 coef2, anglais 16 coef1 → (36+28+16)/6 = 13.3<br>Paradoxe : Lisa > Bart en % mais < en volume → le résultat dépend du poids des données.”},
{id:‘s07’,cat:‘Stats’,q:“Boîte à moustaches : 5 éléments et ce que représente la boîte.”,a:“Sur 1 seule échelle linéaire : min | Q1(25%) | médiane Q2(50%) | Q3(75%) | max.<br>La boîte = Q1→Q3 = 50% des données du milieu. Moustaches = valeurs extrêmes.”},

{id:‘p01’,cat:‘Proba’,q:“Formule de Bayes développée (sans P(B)). Quand l’utiliser ?”,a:“P(A|B) = [P(B|A)×P(A)] / [P(B|A)×P(A) + P(B|¬A)×P(¬A)]<br>Utiliser quand on connaît P(B|A) mais qu’on veut P(A|B). En justice : on sait P(fait|innocent), on veut P(innocent|fait).”},
{id:‘p02’,cat:‘Proba’,q:“Sophisme du procureur : explication et exemple.”,a:“Confondre P(X|I) avec P(I|X). Affaire Sally Clark : P(2 morts|innocente)=1/73M → le procureur déduit P(innocente|2 morts)≃0. ERREUR. Bayes correct → P(innocente|2 morts) ≃ 1/2.”},
{id:‘p03’,cat:‘Proba’,q:“TP4 Bayes : feuille de triche parmi 4 étudiants. 10% de tricheurs, P(feuille|tricheur)=1/20. Suis-je coupable ?”,a:“P(NI)=0.1, P(I)=0.9, P(X|NI)=0.05, P(X|I)=1/(4×20)=0.0125<br>P(NI|X) = (0.05×0.1)/(0.05×0.1+0.0125×0.9)<br>= 0.005/0.01625 ≃ 31% de chance d’être coupable.”},
{id:‘p04’,cat:‘Proba’,q:“Formule P(A∪B). Exemple manga/BD.”,a:“P(A∪B) = P(A) + P(B) − P(A∩B)<br>L’intersection est retranchée (compterait double sinon).<br>Ex: 50% manga + 40% BD − 30% les deux = 60%.”},
{id:‘p05’,cat:‘Proba’,q:“Espérance mathématique E(X) : définition et lien avec la moyenne.”,a:“E(X) = Σxi×pi = valeur moyenne théorique sur ∞ répétitions.<br>Ex dé : E(X)=(1+2+3+4+5+6)/6=3.5<br>Quand n→∞, la moyenne empirique converge vers E(X).”},
];

// ── STATE ────────────────────────────────────
const STORAGE_KEY=‘r216_stats_v1’;
let state={category:‘all’,deck:[],index:0,flipped:false,progress:{}};

function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify({category:state.category,progress:state.progress}));}
function loadState(){
try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s){state.category=s.category||‘all’;state.progress=s.progress||{};}}catch(e){}
}

// ── DECK ─────────────────────────────────────
function getCategories(){
const cats=[…new Set(ALL_CARDS.map(c=>c.cat))];
return[‘all’,‘Essentiel’,…cats.filter(c=>c!==‘Essentiel’)];
}
function buildDeck(){
state.deck=state.category===‘all’?[…ALL_CARDS]:ALL_CARDS.filter(c=>c.cat===state.category);
if(state.index>=state.deck.length)state.index=0;
}
function shuffleDeck(){
for(let i=state.deck.length-1;i>0;i–){const j=Math.floor(Math.random()*(i+1));[state.deck[i],state.deck[j]]=[state.deck[j],state.deck[i]];}
state.index=0;state.flipped=false;render();toast(‘Deck mélangé !’);
}

// ── RENDER ────────────────────────────────────
function render(){
const card=state.deck[state.index];
if(!card){document.getElementById(‘cardArea’).innerHTML=’<div class="empty"><div class="emoji">📭</div>Aucune carte.</div>’;return;}
const cc=‘cat-’+card.cat.toLowerCase();
document.getElementById(‘cardFront’).className=`card-face card-front ${cc}`;
document.getElementById(‘cardBack’).className=`card-face card-back ${cc}`;
[‘frontCat’,‘backCat’].forEach(id=>document.getElementById(id).textContent=card.cat);
const n=`${state.index+1} / ${state.deck.length}`;
[‘cardNum’,‘backNum’].forEach(id=>document.getElementById(id).textContent=n);
document.getElementById(‘cardQ’).textContent=card.q;
document.getElementById(‘cardA’).innerHTML=card.a;
document.getElementById(‘cardInner’).classList.toggle(‘flipped’,state.flipped);
document.getElementById(‘verdictZone’).style.display=state.flipped?‘flex’:‘none’;
const known=Object.values(state.progress).filter(v=>v===‘known’).length;
const unknown=Object.values(state.progress).filter(v=>v===‘unknown’).length;
const total=ALL_CARDS.length;
const left=state.deck.filter(c=>!state.progress[c.id]).length;
document.getElementById(‘knownCount’).textContent=known;
document.getElementById(‘totalCount’).textContent=total;
document.getElementById(‘s-known’).textContent=known;
document.getElementById(‘s-unknown’).textContent=unknown;
document.getElementById(‘s-left’).textContent=left;
document.getElementById(‘progressFill’).style.width=(known/total*100)+’%’;
updateTabs();
}

function flipCard(){
state.flipped=!state.flipped;
document.getElementById(‘cardInner’).classList.toggle(‘flipped’,state.flipped);
document.getElementById(‘verdictZone’).style.display=state.flipped?‘flex’:‘none’;
}
function nextCard(){state.index=(state.index+1)%state.deck.length;state.flipped=false;render();}
function prevCard(){state.index=(state.index-1+state.deck.length)%state.deck.length;state.flipped=false;render();}
function markCard(known){
const card=state.deck[state.index];if(!card)return;
state.progress[card.id]=known?‘known’:‘unknown’;
saveState();nextCard();
}

// ── CATEGORY ─────────────────────────────────
function filterCategory(cat){state.category=cat;state.index=0;state.flipped=false;buildDeck();render();}
function resetCategory(){state.deck.map(c=>c.id).forEach(id=>delete state.progress[id]);saveState();state.index=0;state.flipped=false;render();toast(‘Catégorie réinitialisée’);}
function resetAll(){state.progress={};state.index=0;state.flipped=false;saveState();render();toast(‘Progression réinitialisée’);}

// ── TABS ─────────────────────────────────────
function updateTabs(){
document.getElementById(‘tabsContainer’).querySelectorAll(’.tab’).forEach(btn=>{btn.classList.toggle(‘active’,btn.dataset.cat===state.category);});
}
function buildTabs(){
const c=document.getElementById(‘tabsContainer’);c.innerHTML=’’;
getCategories().forEach(cat=>{
const count=cat===‘all’?ALL_CARDS.length:ALL_CARDS.filter(x=>x.cat===cat).length;
const btn=document.createElement(‘button’);
btn.className=‘tab cat-’+cat.toLowerCase()+(cat===state.category?’ active’:’’);
btn.dataset.cat=cat;
btn.textContent=cat===‘all’?`Tout (${count})`:`${cat} (${count})`;
btn.onclick=()=>filterCategory(cat);
c.appendChild(btn);
});
setTimeout(updateArrows,50);
c.addEventListener(‘scroll’,updateArrows,{passive:true});
}
function updateArrows(){
const el=document.getElementById(‘tabsContainer’);
document.getElementById(‘arrowLeft’).classList.toggle(‘visible’,el.scrollLeft>8);
document.getElementById(‘arrowRight’).classList.toggle(‘visible’,el.scrollLeft+el.clientWidth<el.scrollWidth-8);
}
function scrollTabs(dir){document.getElementById(‘tabsContainer’).scrollBy({left:dir*160,behavior:‘smooth’});}

// ── TOAST ────────────────────────────────────
function toast(msg){const t=document.getElementById(‘toast’);t.textContent=msg;t.classList.add(‘show’);setTimeout(()=>t.classList.remove(‘show’),2000);}

// ── KEYBOARD ─────────────────────────────────
document.addEventListener(‘keydown’,e=>{
if(e.key===’ ’||e.key===‘Enter’){e.preventDefault();flipCard();}
else if(e.key===‘ArrowRight’)nextCard();
else if(e.key===‘ArrowLeft’)prevCard();
else if((e.key===‘k’||e.key===‘K’)&&state.flipped)markCard(true);
else if((e.key===‘j’||e.key===‘J’)&&state.flipped)markCard(false);
});

// ── INIT ─────────────────────────────────────
loadState();buildDeck();buildTabs();render();
window.addEventListener(‘resize’,updateArrows);
</script>
